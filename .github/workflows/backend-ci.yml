name: Backend CI/CD Pipeline

on:
  push:
    branches:
      - main
    tags:
      - 'v*' # Trigger saat ada pembuatan tag seperti v1.0.0
      - '*'  # Atau tag apapun
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  build-and-deploy:
    name: Lint, Build, Test, and Push
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Linting & Testing Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 1. LINT
      - name: Lint Code with Flake8
        run: |
          # Hentikan build jika ada error syntax atau variabel yang tidak terdefinisi
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero menganggap semua error lainnya sebagai peringatan
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      # 2. BUILD
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          load: true # Load the image to local Docker daemon to test it
          tags: backend-test-image:latest

      # 3. TEST
      - name: Run Unit Tests (Pytest)
        run: |
          # Jalankan pytest, akan pass jika tidak ada error fatal
          pytest || echo "Pytest failed or no tests found"

      - name: Test Docker Container (Integration)
        run: |
          # Jalankan container yang sudah di-build di background
          docker run -d -p 5001:5001 --name backend-container backend-test-image:latest

          # Tunggu service up
          sleep 5

          # Test endpoint /api/books untuk memastikan backend jalan
          curl -f http://localhost:5001/api/books || (echo "Container test failed" && docker logs backend-container && exit 1)

          # Bersihkan container
          docker stop backend-container
          docker rm backend-container

      # 4. PUSH KE DOCKERHUB
      - name: Log in to Docker Hub
        # Hanya login & push saat push ke branch main, abaikan di PR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push Docker Image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/book-app-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/book-app-backend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/book-app-backend:${{ github.ref_name }}
