apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-app-backend
  labels:
    app: book-app-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book-app-backend
  template:
    metadata:
      labels:
        app: book-app-backend
    spec:
      containers:
        - name: backend
          image: dimaspratama04/book-app-backend:v1.0.4
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5001
          envFrom:
            - configMapRef:
                name: book-app-backend-config
          # Inject SECRET_KEY from a Secret (create it separately — see configmap.yaml).
          # env:
          #   - name: SECRET_KEY
          #     valueFrom:
          #       secretKeyRef:
          #         name: book-app-backend-secret
          #         key: SECRET_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          readinessProbe:
            httpGet:
              path: /api/test
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/test
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
