apiVersion: v1
kind: ConfigMap
metadata:
  name: blackbox-config
  labels:
    app: book-app-backend
data:
  config.yml: |
    modules:
      http_2xx:
        prober: http
        timeout: 5s
        http:
          valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
          valid_status_codes: []  # Defaults to 2xx
          method: GET
