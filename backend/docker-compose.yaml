services:
  db:
    image: postgres:15-alpine
    container_name: book-app-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpassword
      POSTGRES_DB: booktracker_prod
    ports:
      - "5432:5432"
    networks:
      - shared-network
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: book-app-backend
    restart: unless-stopped
    ports:
      - "5001:5001"
    env_file:
      - .env
    depends_on:
      - db
    networks:
      - shared-network
    volumes:
      - ./books.json:/app/books.json

networks:
  shared-network:
    name: book-app-network

volumes:
  postgres_data:
