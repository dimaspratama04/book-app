---
# Docker role default variables

# Docker apt packages to install
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin

# Add these users to the `docker` group so they can run docker without sudo.
docker_users:
  - "{{ ansible_user | default(ansible_env.USER | default('root')) }}"

# Ensure the docker service is started and enabled on boot.
docker_service_enabled: true
docker_service_state: started
