---
# Install K3s (lightweight Kubernetes) as a single-node server using the
# official get.k3s.io install script.

- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary

- name: Download the K3s install script
  ansible.builtin.get_url:
    url: "{{ k3s_install_url }}"
    dest: /tmp/k3s-install.sh
    mode: "0755"
  when: not k3s_binary.stat.exists

- name: Run the K3s install script
  ansible.builtin.command: /tmp/k3s-install.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: "{{ k3s_server_args }}"
  args:
    creates: /usr/local/bin/k3s
  notify: Restart k3s

- name: Ensure k3s service is started and enabled
  ansible.builtin.systemd:
    name: k3s
    state: started
    enabled: true

- name: Wait for the node to become Ready
  ansible.builtin.command: k3s kubectl get nodes
  register: k3s_nodes
  until: "'Ready' in k3s_nodes.stdout"
  retries: 20
  delay: 5
  changed_when: false

- name: Show cluster nodes
  ansible.builtin.debug:
    msg: "{{ k3s_nodes.stdout_lines }}"

- name: Remove the install script
  ansible.builtin.file:
    path: /tmp/k3s-install.sh
    state: absent
