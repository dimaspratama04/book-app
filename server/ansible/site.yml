---
# Main playbook: provisions a server with Docker and K3s.
#
# Usage:
#   ansible-playbook site.yml
#   ansible-playbook site.yml --limit k3s_servers
#   ansible-playbook site.yml -i inventory/hosts.ini --limit local

- name: Provision Docker and K3s
  hosts: all
  become: true
  gather_facts: true

  roles:
    - role: docker
    - role: k3s
