# Inventory file
#
# Replace the host/IP and connection details with your target server(s).
# For a local test run you can use the `localhost` entry below.

[k3s_servers]
# server1 ansible_host=192.168.1.10 ansible_user=ubuntu

[k3s_servers:vars]
ansible_python_interpreter=/usr/bin/python3

# Uncomment to run everything against the control machine itself.
[local]
localhost ansible_connection=local
